script: uga_survey.R

parameters:
  version:
    default: "2023"
  iso3:
    default: "UGA"

artefacts:
  - data:
      description: UPHIA 2020-2021 survey indicator data set
      filenames:
        - uga2020phia_hiv_indicators.csv
  - staticgraph:
       description: UPHIA survey regions vs. area hierarchy
       filenames:
         - check/uphia-survey-region-boundaries.png
  - data:
      description: UPHIA 2020-21 survey microdata
      filenames:
        - uga2020phia_survey_meta.csv
        - uga2020phia_survey_regions.csv
        - uga2020phia_survey_clusters.csv
        - uga2020phia_survey_individuals.csv
        - uga2020phia_survey_biomarker.csv
        - uga2020phia_survey_circumcision.csv


packages:
  - dplyr
  - forcats
  - ggplot2
  - naomi.utils
  - readr
  - sf
  - spud
  - tidyr

depends:
  aaa_areas_pull:
    id: latest(parameter:version == version && parameter:iso3 == iso3)
    use:
      depends/naomi_areas.geojson: naomi_areas.geojson
